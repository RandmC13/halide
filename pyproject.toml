[project]
name = "halide"
version = "0.1.0"
description = "Colorimetrically accurate inversion of digital scans of color negative film."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "tifffile",
    "imagecodecs",
    "colour-science",
    "scipy",
    "PySide6",
    "pillow",  # delivery-format export only (8-bit PNG/JPEG writing + a synthesized sRGB ICC
               # profile) — NOT used for the ICC-parsing in io/icc.py, see its module docstring
    "psutil",  # cross-platform available-memory query, batch/orchestrator.py's worker-count sizing
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
halide = "halide.cli.main:run_cli"

[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The vendored ICC profile and paper curve are read at runtime, so they ship inside the package.
[tool.setuptools.package-data]
halide = ["assets/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

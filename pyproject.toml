[project]
name = "halide"
version = "0.1.0"
description = "Colorimetrically accurate inversion of digital scans of color negative film."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "tifffile",
    "imagecodecs",
    "colour-science",
    "scipy",
    "PySide6",
    "pillow",  # delivery-format export only (8-bit PNG/JPEG writing + a synthesized sRGB ICC
               # profile) — NOT used for the ICC-parsing in io/icc.py, see its module docstring
    "psutil",  # cross-platform available-memory query, batch/orchestrator.py's worker-count sizing
    "shtab",  # generates the zsh tab-completion script from the argparse parser, cli/completion.py
]

[project.optional-dependencies]
dev = ["pytest"]
# GPU acceleration is opt-in (see CLAUDE.md and docs/plans/gpu-acceleration.md): CuPy plus
# NVIDIA's runtime libraries is ~1 GB, so a plain install never pulls it in. Pick the extra
# matching your CUDA driver (`halide gpu` reports which); `[ctk]` bundles the matching CUDA
# Toolkit runtime libraries so a system CUDA install isn't required.
cuda12 = ["cupy-cuda12x[ctk]>=14"]
cuda13 = ["cupy-cuda13x[ctk]>=14"]

[project.scripts]
halide = "halide.cli.main:run_cli"

[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The vendored ICC profile and paper curve are read at runtime, so they ship inside the package.
[tool.setuptools.package-data]
halide = ["assets/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CuPy and a CUDA device"]
# pytest's default keeps every test's tmp_path from the last 3 runs under the system temp dir, which
# is RAM (tmpfs) on many Linux desktops. The real-scan GPU tests write ~130 MiB TIFFs each: one
# `pytest -m gpu` run left 5.2 GB in /tmp on the user's machine and nearly exhausted its memory.
# "failed" deletes a passing test's directory as soon as that test ends ("none" only cleans up when
# the whole session exits, so it wouldn't cap the peak); only the last run's failures are kept.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
